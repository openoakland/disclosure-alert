# Ruby CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/language-ruby/ for more details
#
# Config version 2 reached end of life, so pipelines no longer start on it.
# 2.1 requires the workflow below to be declared explicitly rather than
# relying on the implicit run of a job named "build".
version: 2.1

jobs:
  build:
    docker:
      # Ruby version matching .ruby-version file
      - image: cimg/ruby:3.4.7-node

      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      - image: cimg/postgres:14.14
        environment:
          POSTGRES_USER: disclosure-alert
          POSTGRES_DB: disclosure_alert-test
          POSTGRES_PASSWORD: disclosure-test-password

    working_directory: ~/repo

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "Gemfile.lock" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run:
          name: install dependencies
          command: |
            bundle install --jobs=4 --retry=3 --path vendor/bundle

      - save_cache:
          paths:
            - ./vendor/bundle
          key: v1-dependencies-{{ checksum "Gemfile.lock" }}

      # Database setup
      - run:
          name: Set up Database
          command: bundle exec rake db:create db:schema:load --trace
          environment: &rails_environment
            RAILS_ENV: test
            PGUSER: disclosure-alert
            PGHOST: localhost
            PGPASSWORD: disclosure-test-password

      # run tests!
      - run:
          name: run tests
          environment: *rails_environment
          command: |
            mkdir /tmp/test-results
            TEST_FILES="$(circleci tests glob "spec/**/*_spec.rb" | \
              circleci tests split --split-by=timings)"

            bundle exec rspec \
              --format progress \
              --format RspecJunitFormatter \
              --out /tmp/test-results/rspec.xml \
              --format progress \
              --backtrace \
              $TEST_FILES

      # collect reports
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results

workflows:
  test:
    jobs:
      - build
